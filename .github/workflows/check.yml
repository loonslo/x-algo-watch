name: Check upstream algorithm

on:
  schedule:
    - cron: '17 1-22/3 * * *'
  workflow_dispatch:
    inputs:
      test_from:
        description: '历史测试基线（须与 test_to 同时填写，不推进生产状态）'
        type: string
        default: ''
      test_to:
        description: '历史测试目标提交'
        type: string
        default: ''
      backfill_commit:
        description: '补写已登记的历史提交（完整 SHA；不推进检测进度，不能与历史测试混用）'
        type: string
        default: ''
      research_commit:
        description: '整版本项目研究：已有完整迭代记录的完整 SHA（不推进检查进度）'
        type: string
        default: ''
      research_all:
        description: '将已有完整历史迭代加入模型研究队列，后续按额度逐批续写'
        type: boolean
        default: false
      resume_iterations:
        description: '处理问题后恢复暂停的修订（须填写单个 research_commit；保留历史）'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: x-algo-watch-main
  cancel-in-progress: false

jobs:
  detect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      has_alerts: ${{ steps.detect.outputs.has_alerts }}
      has_research: ${{ steps.detect.outputs.has_research }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - run: python -m pip install --require-hashes -r requirements.txt
      - id: detect
        env:
          TEST_FROM: ${{ inputs.test_from }}
          TEST_TO: ${{ inputs.test_to }}
          BACKFILL_COMMIT: ${{ inputs.backfill_commit }}
          RESEARCH_COMMIT: ${{ inputs.research_commit }}
          RESEARCH_ALL: ${{ inputs.research_all }}
        run: python -m x_algo_watch.automation detect --bundle runtime/detect
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: inspection
          path: |
            runtime/detect/manifest.json
            runtime/detect/data/
          if-no-files-found: error
          retention-days: 7

  draft:
    needs: detect
    if: github.ref == 'refs/heads/main' && (needs.detect.outputs.has_alerts == 'true' || needs.detect.outputs.has_research == 'true') && vars.DRAFT_ENABLED == 'true' && inputs.test_from == ''
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: openrouter
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: inspection
          path: runtime/detect
      - run: python -m pip install --require-hashes -r requirements.txt
      - name: Analyze and review evidence
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          RESUME_ITERATIONS: ${{ inputs.resume_iterations }}
        run: python -m x_algo_watch.drafting --bundle runtime/detect --output runtime/draft.json
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: draft
          path: runtime/draft.json
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [detect, draft]
    if: always() && github.ref == 'refs/heads/main' && needs.detect.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: inspection
          path: runtime/detect
      - if: needs.draft.result == 'success'
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: draft
          path: runtime
      - run: python -m pip install --require-hashes -r requirements.txt
      - env:
          GH_TOKEN: ${{ github.token }}
        run: python -m x_algo_watch.automation publish --bundle runtime/detect --draft-bundle runtime/draft.json
      - name: Report incomplete inspection after publishing evidence
        run: python -m x_algo_watch.automation assert-complete --bundle runtime/detect
