name: Review one version sample

on:
  workflow_dispatch:
    inputs:
      research_commit:
        description: '已有完整证据的版本完整 SHA'
        type: string
        required: true
      resume_iterations:
        description: '处理问题后显式恢复暂停批次，保留全部旧候选'
        type: boolean
        default: false
      direct_probe:
        description: '直接诊断当前配置型号：最小文本及 JSON 请求，不执行研究'
        type: boolean
        default: false
      review_replay:
        description: '直接诊断时重放该提交原404审核请求（必须同时启用direct_probe）'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: x-algo-watch-main
  cancel-in-progress: false

jobs:
  draft:
    if: github.ref == 'refs/heads/main' && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: openrouter
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - run: python -m pip install --require-hashes -r requirements.txt
      - name: Prepare existing evidence
        env:
          RESEARCH_COMMIT: ${{ inputs.research_commit }}
        run: python -m x_algo_watch.sample --commit "$RESEARCH_COMMIT" --bundle runtime/sample
      - name: Reconcile shared model-call budget
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m x_algo_watch.call_budget --output runtime/budget.json --ledger runtime/call-ledger.json --bundle runtime/sample --draft-output runtime/draft.json
      - name: Iterate drafts and run all three review roles
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          RESUME_ITERATIONS: ${{ inputs.resume_iterations }}
          DIRECT_PROBE: ${{ inputs.direct_probe }}
          REVIEW_REPLAY: ${{ inputs.review_replay }}
          RESEARCH_COMMIT: ${{ inputs.research_commit }}
        run: |
          if [ "$DIRECT_PROBE" = "true" ]; then
            if [ "$REVIEW_REPLAY" = "true" ]; then
              python -m x_algo_watch.model_probe --budget-receipt runtime/budget.json --call-ledger runtime/call-ledger.json --output runtime/model-probe.json --review-replay
            else
              python -m x_algo_watch.model_probe --budget-receipt runtime/budget.json --call-ledger runtime/call-ledger.json --output runtime/model-probe.json
            fi
          else
            python -m x_algo_watch.drafting --bundle runtime/sample --output runtime/draft.json --budget-receipt runtime/budget.json --call-ledger runtime/call-ledger.json
          fi
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with:
          name: call-ledger-${{ github.run_id }}-${{ github.run_attempt }}
          path: runtime/call-ledger.json
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with:
          name: reviewed-sample
          path: |
            runtime/sample/manifest.json
            runtime/sample/data/
            runtime/draft.json
            runtime/model-probe.json
          if-no-files-found: error
          retention-days: 7
