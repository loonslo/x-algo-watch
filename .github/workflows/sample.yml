name: Review one version sample

on:
  workflow_dispatch:
    inputs:
      research_commit:
        description: '已有完整证据的版本完整 SHA'
        type: string
        required: true
      resume_iterations:
        description: '处理问题后显式恢复暂停批次，保留全部旧候选'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: x-algo-watch-main
  cancel-in-progress: false

jobs:
  draft:
    if: github.ref == 'refs/heads/main' && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: openrouter
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - run: python -m pip install --require-hashes -r requirements.txt
      - name: Prepare existing evidence
        env:
          RESEARCH_COMMIT: ${{ inputs.research_commit }}
        run: python -m x_algo_watch.sample --commit "$RESEARCH_COMMIT" --bundle runtime/sample
      - name: Iterate drafts and run all three review roles
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          RESUME_ITERATIONS: ${{ inputs.resume_iterations }}
        run: python -m x_algo_watch.drafting --bundle runtime/sample --output runtime/draft.json
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: reviewed-sample
          path: |
            runtime/sample/manifest.json
            runtime/sample/data/
            runtime/draft.json
          if-no-files-found: error
          retention-days: 7
