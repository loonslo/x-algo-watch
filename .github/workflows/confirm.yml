name: Confirm reviewed digest

on:
  issues:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: x-algo-watch-main
  cancel-in-progress: false

jobs:
  confirm:
    if: github.actor == github.repository_owner && (github.event.label.name == '已确认' || github.event.label.name == '驳回')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - run: python -m pip install --require-hashes -r requirements.txt
      - env:
          GH_TOKEN: ${{ github.token }}
        run: python -m x_algo_watch.confirmation
