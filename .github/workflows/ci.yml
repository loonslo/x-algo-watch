name: Test inspection pipeline

on:
  push:
    branches: [main]
    paths-ignore: ['data/**', 'digest.md']
  pull_request:
    paths-ignore: ['data/**', 'digest.md']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - run: python -m pip install --require-hashes -r requirements.txt -r requirements-dev.txt
      - name: Read-only upstream object database
        run: git -c core.hooksPath= clone --no-checkout https://github.com/xai-org/x-algorithm runtime/upstream
      - run: python -m pytest -c pyproject.toml tests -q --upstream-repo=runtime/upstream
