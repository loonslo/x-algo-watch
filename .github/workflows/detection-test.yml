name: Validate detection boundary

on:
  workflow_dispatch:
    inputs:
      test_from:
        description: '隔离测试基线完整 SHA'
        type: string
        required: true
      test_to:
        description: '隔离测试目标完整 SHA'
        type: string
        required: true

permissions:
  contents: read

jobs:
  inspect:
    if: github.ref == 'refs/heads/main' && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - run: python -m pip install --require-hashes -r requirements.txt
      - name: Run isolated inspection on GitHub
        env:
          TEST_FROM: ${{ inputs.test_from }}
          TEST_TO: ${{ inputs.test_to }}
        run: python -m x_algo_watch.automation detect --bundle runtime/detection-test
      - name: Preserve actual inspection evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: detection-test-evidence
          path: |
            runtime/detection-test/manifest.json
            runtime/detection-test/data/
          if-no-files-found: error
          retention-days: 7
      - name: Require a complete inspection
        run: python -m x_algo_watch.automation assert-complete --bundle runtime/detection-test
