    snippet: "pub fn offset_score(combined_score: f64, w: &ValueModelWeights) -> f64 {\n    let total_sum = w.total_sum();\n\
      \    if total_sum == 0.0 {\n        combined_score.max(0.0)\n    } else if combined_score < 0.0 {\n        (combined_score\
      \ + w.negative_sum()) / total_sum * NEGATIVE_SCORES_OFFSET\n    } else {\n        combined_score + NEGATIVE_SCORES_OFFSET\n\
      \    }\n}"
