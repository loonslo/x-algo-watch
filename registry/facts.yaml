      \    let lo = params.slot_min.min(hi);\n    if lo >= hi {\n        return None;\n    }\n    let rank = rand::rng().random_range(lo..hi);\n\
      \    Some((rank, ranked[rank]))\n}\n\nfn cold_start_corpus_eligible(arm: ViewerArm, corpus: AuthorCorpus) -> bool {\n\
      \    match arm {\n        ViewerArm::Holdout => true,\n        ViewerArm::Control => corpus == AuthorCorpus::Control,\n\
      \        ViewerArm::Treatment => corpus == AuthorCorpus::Treatment,\n    }\n}\n\nfn pick_by_score(eligible: &[usize],\
      \ scores: &[f64]) -> Option<usize> {\n    eligible\n        .iter()\n        .copied()\n        .max_by(|&i, &j| scores[i].total_cmp(&scores[j]).then(i.cmp(&j)))\n\
      }\n\nfn sample_reward<R: Rng + ?Sized>(\n    candidate: &PostCandidate,\n    alpha0: f64,\n    beta0: f64,\n    scale:\
      \ f64,\n    rng: &mut R,\n) -> f64 {\n    let n = scale * candidate.view_count_on_home.unwrap_or(0) as f64;\n    let\
      \ x = (candidate.fav_count.unwrap_or(0).max(0) as f64).min(n);\n    let alpha = alpha0 + x;\n    let beta = beta0 +\
      \ (n - x).max(0.0);\n    Beta::new(alpha, beta).map(|d| d.sample(rng)).unwrap_or(0.5)\n}\n\nfn pick_thompson<R: Rng\
      \ + ?Sized>(\n    eligible: &[usize],\n    candidates: &[PostCandidate],\n    scores: &[f64],\n    alpha0: f64,\n  \
      \  beta0: f64,\n    scale: f64,\n    top_k: usize,\n    rng: &mut R,\n) -> Option<usize> {\n    if eligible.is_empty()\
      \ {\n        return None;\n    }\n    if top_k == 0 || alpha0 <= 0.0 || beta0 <= 0.0 {\n        return pick_by_score(eligible,\
      \ scores);\n    }\n    let mut sampled: Vec<(usize, f64)> = eligible\n        .iter()\n        .map(|&i| (i, sample_reward(&candidates[i],\
      \ alpha0, beta0, scale, rng)))\n        .collect();\n    sampled.sort_by(|a, b| b.1.total_cmp(&a.1).then(a.0.cmp(&b.0)));\n\
      \    let k = top_k.min(sampled.len());\n    sampled[..k]\n        .iter()\n        .map(|(i, _)| *i)\n        .max_by(|&i,\
      \ &j| scores[i].total_cmp(&scores[j]).then(i.cmp(&j)))\n}\n\nfn apply_cold_start(\n    params: &ColdStartParams,\n \
      \   candidates: &[PostCandidate],\n    scores: &[f64],\n    corpus: &[AuthorCorpus],\n    target: f64,\n) -> (Vec<f64>,\
      \ Option<usize>) {\n    let arm = params.arm;\n    let (positions, nonzero) = positions_among_nonzero(scores);\n   \
      \ let max_cold_start_slot = (params.max_position_ratio * nonzero as f64) as usize;\n\n    let eligible: Vec<usize> =\
      \ candidates\n        .iter()\n        .enumerate()\n        .filter(|(i, c)| {\n            cold_start_base_eligible(c,\
      \ params.follower_cap)\n                && cold_start_corpus_eligible(arm, corpus[*i])\n                && duration_since_creation_opt(c.tweet_id)\n\
      \                    .is_some_and(|age| age <= params.max_post_age)\n                && positions[*i] < max_cold_start_slot\n\
      \                && c.view_count_on_home\n                    .is_some_and(|imp| imp < params.impression_threshold)\n\
      \        })\n        .map(|(i, _)| i)\n        .collect();\n\n    let best_idx = if params.use_thompson_sampling {\n\
      \        pick_thompson(\n            &eligible,\n            candidates,\n            scores,\n            params.beta_alpha0,\n\
      \            params.beta_beta0,\n            params.impression_scale,\n            params.ts_top_k,\n            &mut\
      \ rand::rng(),\n        )\n    } else {\n        pick_by_score(&eligible, scores)\n    };\n\n    let Some(best_idx)\
      \ = best_idx else {\n        return (scores.to_vec(), None);\n    };\n\n    let mut effective = scores.to_vec();\n \
      \   effective[best_idx] = effective[best_idx].max(target);\n    record_cold_started_posts(arm.as_str(), 1);\n    (effective,\
      \ Some(best_idx))\n}"
