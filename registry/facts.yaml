    name: reference_27efa74194b26fce
    snippet: "def computeScoresForInteractions(\n    interactionSizes: TypedPipe[(Long, Long)],\n    favSizes: TypedPipe[(Long,\
      \ Long)],\n    smoothingParam: Double,\n    labelName: String\n  ): TypedPipe[UserLabel] = {\n    val interactionAndFavs\
      \ = favSizes\n      .outerJoin(interactionSizes)\n      .mapValues {\n        case (favOpt, interactionOpt) => (interactionOpt.getOrElse(0L),\
      \ favOpt.getOrElse(0L))\n      }\n      .forceToDisk\n\n    val interactionPerFavPrior = getPrior(capFeatureSum(interactionAndFavs.values))\n\
      \n    interactionAndFavs\n      .cross(interactionPerFavPrior)\n      .map {\n        case ((userId, (interaction, favs)),\
      \ prior) =>\n          val numerator = interaction + smoothingParam\n          val denominator = interaction + favs\
      \ + (smoothingParam / prior)\n          UserLabel(\n            userId,\n            labelName,\n            interaction.toInt,\n\
      \            (interaction + favs).toInt,\n            Some(numerator / denominator))\n      }\n  }"
    start_offset: 0
    end_offset: 28
